<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funerária Jardins</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: {
    floresta: "#1B4332", dourado: "#C9A227"
  }}}}</script>
</head>
<body class="min-h-screen bg-[#1B4332] flex flex-col items-center justify-center gap-8 p-8">

  <!-- Logo -->
  <div class="flex flex-col items-center gap-4">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" width="110" height="110">
      <circle cx="60" cy="60" r="57" fill="#1B4332"/>
      <circle cx="60" cy="60" r="57" fill="none" stroke="#C9A227" stroke-width="4.5"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="#C9A227" stroke-width="1.2" opacity="0.5"/>
      <polygon points="60,14 34,50 86,50" fill="#C9A227"/>
      <polygon points="60,30 32,62 88,62" fill="#C9A227"/>
      <polygon points="60,46 30,74 90,74" fill="#C9A227"/>
      <rect x="55" y="74" width="10" height="18" fill="#C9A227" rx="2"/>
    </svg>
    <div class="text-center">
      <h1 class="text-3xl font-bold text-[#C9A227] tracking-wide">Funerária Jardins</h1>
      <p class="text-green-300 text-sm mt-1">Sistema de Gestão</p>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row gap-4 w-full max-w-sm">
    <a href="/adm"
       class="flex-1 px-6 py-4 bg-[#C9A227] text-[#1B4332] rounded-xl font-bold text-base shadow-lg hover:bg-yellow-500 transition text-center">
      🛡️ Painel Administrativo
    </a>
    <a href="/client"
       class="flex-1 px-6 py-4 border-2 border-[#C9A227] text-[#C9A227] rounded-xl font-bold text-base hover:bg-[#C9A227] hover:text-[#1B4332] transition text-center">
      📱 App do Associado
    </a>
  </div>
</body>
</html>
