<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jardins Serviços Funerários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0d1f14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Fundo com textura sutil */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,162,39,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 20% 100%, rgba(27,67,50,0.6) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Linha ornamental topo */
    .ornament-line {
      width: 180px;
      height: 1px;
      background: linear-gradient(to right, transparent, #C9A227, transparent);
      margin: 0 auto;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      padding: 48px 32px;
      width: 100%;
      max-width: 480px;
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(201,162,39,0.4);
      box-shadow: 0 0 40px rgba(201,162,39,0.15), 0 0 0 6px rgba(201,162,39,0.06);
    }

    .brand {
      text-align: center;
    }

    .brand h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: #C9A227;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .brand p {
      font-size: 0.72rem;
      color: rgba(201,162,39,0.55);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,162,39,0.3));
    }
    .divider::after {
      background: linear-gradient(to left, transparent, rgba(201,162,39,0.3));
    }
    .divider span {
      color: rgba(201,162,39,0.4);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .btns {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #C9A227 0%, #e8c04a 50%, #C9A227 100%);
      color: #0d1f14;
      box-shadow: 0 4px 20px rgba(201,162,39,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(201,162,39,0.4);
    }

    .btn-secondary {
      background: transparent;
      color: #C9A227;
      border: 1.5px solid rgba(201,162,39,0.5);
    }
    .btn-secondary:hover {
      background: rgba(201,162,39,0.06);
      border-color: #C9A227;
      transform: translateY(-2px);
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      opacity: 0.8;
    }

    .footer-text {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <img src="/logo.jpeg" alt="Jardins Serviços Funerários" class="logo-img" />
      <div class="brand">
        <h1>Jardins</h1>
        <p>Serviços Funerários</p>
      </div>
    </div>

    <div class="divider"><span>acesso ao sistema</span></div>

    <div class="btns">
      <a href="/adm" class="btn btn-primary">
        <svg class="btn-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        Painel Administrativo
      </a>
      <a href="/client" class="btn btn-secondary">
        <svg class="btn-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Área do Associado
      </a>
    </div>

    <p class="footer-text">© 2025 Jardins Serviços Funerários · Boa Vista/RR</p>
  </div>
</body>
</html>
